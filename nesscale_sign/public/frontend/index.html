<!doctype html>
<html lang="en" data-theme="dark" class="h-full">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover" />
    <title>Nesscale Sign</title>
    <meta name="theme-color" content="#0f0f0f" />
    <script>
      // Public signing pages render light; the app is dark. Set before paint.
      if (/^\/sign(?:\/|$)/.test(location.pathname)) {
        document.documentElement.setAttribute('data-theme', 'light')
        document.documentElement.setAttribute('data-public-signing', '')
        document.title = 'Document Signing'
      }
    </script>
    <style>
      /* Keep the header spacing while hiding the public signer brand/logo.
         Matches the SignPage header in the shipped frontend bundle. */
      html[data-public-signing] #app header.h-14 > div:first-child {
        visibility: hidden;
      }
    </style>
    <script type="module" crossorigin src="/assets/nesscale_sign/frontend/assets/index-DfxiJPPI.js"></script>
    <link rel="stylesheet" crossorigin href="/assets/nesscale_sign/frontend/assets/index-DPyKeXAw.css">
  </head>
  <body class="antialiased h-full">
    <div id="app" class="h-full"></div>
  
          <script>
              {% for key in boot %}
              window["{{ key }}"] = {{ boot[key] | tojson }};
              {% endfor %}
          </script>
          </body>
          
</html>
